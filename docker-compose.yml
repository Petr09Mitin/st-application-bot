version: '3.9'
services:
  postgresdb:
    image: postgres:17.2
    container_name: postgres_container
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${PG_DBNAME}
    ports:
      - 5431:5432
    volumes:
      - pg_data:/var/lib/postgresql/data/

  app:
    image: petr09mitin/st-application-bot:latest
    container_name: main
    env_file:
      - .env
    tty: true
    ports:
      - 8078:8078
      - 8080:8080
    restart: always
    volumes:
      - .:/app
      - ./volumes/logs/:/var/log/st_applications/
    depends_on:
      - postgresdb
  
  nginx:
    image: nginx:1.27.3
    restart: always
    volumes:
      - ./config/nginx/:/etc/nginx/
      - /etc/letsencrypt/:/etc/letsencrypt/
      - /root/st-application-front/:/root/st-application-front/
    ports:
      - 80:80
      - 443:443
    depends_on:
      - app

volumes:
  pg_data:
