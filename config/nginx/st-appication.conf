upstream north-tribune-backend {
    server localhost:8078;
}

server {
    server_name north-tribune.ru;

    location /api/v1/ {
        proxy_pass http://north-tribune-backend/api/v1/;
    }

    location / {
        root /root/st-application-front/build;
        try_files $uri /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/north-tribune.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/north-tribune.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = north-tribune.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name north-tribune.ru;
    return 404; # managed by Certbot
}
