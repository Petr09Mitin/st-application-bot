name: Lint and deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build Docker image
    needs: [ linter ]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
  
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build and push main
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./cmd/Dockerfile
        push: true
        tags: petr09mitin/st-application-bot:latest

    - name: Build and push second roster
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./cmd/Dockerfile.sr
        push: true
        tags: petr09mitin/st-application-bot:second-roster

  deploy:
    name: Deploy to VM
    needs: [ build ]
    runs-on: ubuntu-latest

    steps:
    - name: Migrate, build and run
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: |
          cd ./st-application-bot
          git checkout main
          git pull
          export PATH=$PATH:/usr/local/go/bin
          export PATH=$PATH:$(go env GOPATH)/bin
          go install github.com/jackc/tern/v2@latest
          make migrate
          docker compose pull
          docker compose up -d
